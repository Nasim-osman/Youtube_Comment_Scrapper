<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In | YouTube Comment Extractor</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f3f6fb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 410px); padding: 34px; background: #fff; border: 1px solid #e4e9f1; border-radius: 20px; box-shadow: 0 18px 50px #17365d12; }
      .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; color: #fff; background: #d93025; font-size: 22px; }
      h1 { margin: 22px 0 8px; font-size: 25px; }
      p { color: #667085; line-height: 1.6; }
      label { display: block; margin: 22px 0 8px; font-size: 14px; font-weight: 650; }
      input { width: 100%; padding: 12px 13px; border: 1px solid #ccd4e0; border-radius: 10px; font: inherit; }
      button { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 10px; color: #fff; background: #174ea6; font: inherit; font-weight: 650; cursor: pointer; }
      .message { margin: 14px 0 0; padding: 11px 12px; border-radius: 9px; color: #9c2520; background: #fff1ef; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">▶</div>
      <h1>Welcome to Nasim's personal YouTube comment scraper site</h1>
      <p>Enter your app password to access the comment extractor.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="message" role="alert">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="password">App password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Log In</button>
      </form>
    </main>
  </body>
</html>
